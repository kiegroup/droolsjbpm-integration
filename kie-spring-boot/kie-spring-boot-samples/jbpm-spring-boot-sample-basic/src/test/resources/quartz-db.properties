#============================================================================
# Configure Main Scheduler Properties  
#============================================================================

org.quartz.scheduler.instanceName = SpringBootScheduler
org.quartz.scheduler.instanceId = instance_one
org.quartz.scheduler.skipUpdateCheck=true
org.quartz.scheduler.idleWaitTime=1000
#============================================================================
# Configure ThreadPool  
#============================================================================

org.quartz.threadPool.class = org.quartz.simpl.SimpleThreadPool
org.quartz.threadPool.threadCount = 15
org.quartz.threadPool.threadPriority = 5


#============================================================================
# Configure JobStore  
#============================================================================

org.quartz.jobStore.misfireThreshold = 60000

# JobStoreTX manages its own JDBC transactions independently of JTA.
# JobStoreCMT (the alternative) enrolls the managed datasource into the
# surrounding JTA transaction. When jBPM calls scheduler.deleteJob() from
# within its own JTA transaction during timer execution, JobStoreCMT's
# executeInLock uses the same JTA-enrolled connection, whose writes then
# conflict with Quartz's concurrent non-managed transactions
# (triggersFired / triggeredJobComplete), causing H2 row-lock timeouts on
# QRTZ_SIMPLE_TRIGGERS and QRTZ_TRIGGERS regardless of lock handler.
# JobStoreTX routes every Quartz operation through its own short-lived
# JDBC transaction, eliminating all cross-transaction conflicts.
org.quartz.jobStore.class=org.quartz.impl.jdbcjobstore.JobStoreTX
org.quartz.jobStore.driverDelegateClass=org.jbpm.process.core.timer.impl.quartz.DeploymentsAwareStdJDBCDelegate
org.quartz.jobStore.useProperties=false
org.quartz.jobStore.dataSource=notManagedDS
org.quartz.jobStore.tablePrefix=QRTZ_
org.quartz.jobStore.isClustered=false

