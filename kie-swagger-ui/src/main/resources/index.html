<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>${org.kie.swagger.title}</title>
  <link rel="stylesheet" type="text/css" href="./swagger-ui.css" />
  <link rel="stylesheet" type="text/css" href="./index.css" />
  <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
</head>

<body>

<div id="swagger-ui"></div>

<script src="./swagger-ui-bundle.js" charset="UTF-8"> </script>
<script src="./swagger-ui-standalone-preset.js" charset="UTF-8"> </script>
<script>
window.onload = function() {

  // index.html is served from /{contextRoot}/docs/index.html, so strip
  // the trailing /docs/... to get /{contextRoot}, then append the base path.
  const kieContextRoot = window.location.pathname.replace(/\/docs(\/.*)?$/, "");

  // ${org.kie.swagger.base.path} and ${org.kie.swagger.url} are replaced at
  // build time by Maven assembly filtering (kie-server WAR, controller WAR).
  // When the jar is served directly without a filtering step the tokens arrive
  // literally in the browser; the guards below detect that and fall back to
  // sensible runtime defaults derived from the request URL.
  let kieServicesPath = "${org.kie.swagger.base.path}";
  if (kieServicesPath.startsWith("$")) {
    kieServicesPath = "/rest";
  }
  const kieBasePath = kieContextRoot + kieServicesPath;

  let kieOpenApiUrl = "${org.kie.swagger.url}";
  if (kieOpenApiUrl.startsWith("$")) {
    kieOpenApiUrl = kieContextRoot + "/rest/openapi.json";
  }

  // Build a system
  const ui = SwaggerUIBundle({
    url: kieOpenApiUrl,
    dom_id: '#swagger-ui',
    deepLinking: true,
    presets: [
      SwaggerUIBundle.presets.apis,
      SwaggerUIStandalonePreset
    ],
    plugins: [
      SwaggerUIBundle.plugins.DownloadUrl
    ],
    layout: "StandaloneLayout",
    validatorUrl: null,
    responseInterceptor: function(response) {
      // Swagger UI does not correctly use the OpenAPI 3.0 servers[].url
      // path for curl example display. Rewrite the servers array in the parsed
      // spec (body/obj) before Swagger UI renders it.
      // serializeRes populates response.body and response.obj with the parsed
      // object, and response.text/data with the raw string.
      if (response.url && response.url.indexOf("openapi.json") !== -1) {
        try {
          var fullServerUrl = window.location.origin + kieBasePath;
          // patch the parsed object (used for rendering)
          if (response.body && typeof response.body === "object") {
            response.body.servers = [{ url: fullServerUrl }];
          }
          if (response.obj && typeof response.obj === "object") {
            response.obj.servers = [{ url: fullServerUrl }];
          }
          // also patch the raw text so any re-parse produces the same result
          if (response.text) {
            try {
              var raw = JSON.parse(response.text);
              raw.servers = [{ url: fullServerUrl }];
              response.text = JSON.stringify(raw);
              response.data = response.text;
            } catch(e2) {}
          }
        } catch(e) {}
      }
      return response;
    },
    requestInterceptor: function(request) {
      // Fix actual Try-it-out requests for the same reason.
      if (kieBasePath && request.url) {
        var base = window.location.origin + kieBasePath;
        if (request.url.indexOf(base) === -1 &&
            request.url.indexOf(window.location.origin + "/") === 0) {
          var opPath = request.url.substring(window.location.origin.length);
          request.url = window.location.origin + kieBasePath + opPath;
        }
      }
      return request;
    }
  })

  window.ui = ui
}
</script>
</body>

</html>
